name: Retrain & refresh metrics

on:
  schedule:
    - cron: "23 5 2 1,4,7,10 *"   # quarterly: Jan/Apr/Jul/Oct, 05:23 UTC on the 2nd
  workflow_dispatch:               # manual run button
  push:
    paths: [ "train_fraud.py", "download_data.py", "collect_fraud.py", "stage_fraud.py" ]

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset + retrain + regenerate figures
        run: |
          python download_data.py
          python train_fraud.py

      - name: Commit refreshed metrics + figures
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/metrics.json figures/ || true
          if git diff --cached --quiet; then
            echo "No metric changes since last run"
          else
            git commit -m "chore: refresh metrics (scheduled retrain) [skip ci]"
            git push
          fi
